volumes:
  go-mod-cache:
  go-build-cache:

x-go-dev-service: &go-dev-service
  image: golang:1.20
  depends_on:
    - kafka
  volumes:
    - ./:/go/src/github.com/kiran/arbiter
    - go-mod-cache:/go/pkg/mod
    - go-build-cache:/root/.cache/go-build
  working_dir: /go/src/github.com/kiran/arbiter

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Listen on container interface
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      # Advertise both an internal address for other containers and a host address for host tools
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    depends_on:
      - kafka
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERCONNECT: "kafka:9092"
    ports:
      - "9000:9000"

  # Development helpers: run the Go producer/consumer inside the compose network
  consumer-dev:
    <<: *go-dev-service
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${NORMALIZED_TICKS_TOPIC:-normalized.ticks}
      KAFKA_GROUP_ID: ${CONSUMER_GROUP_ID:-arbiter-consumer}
    command: ["sh","-c","go run ./cmd/consumer"]

  producer-dev:
    <<: *go-dev-service
    environment:
      KAFKA_BROKERS: kafka:9092
    command: ["sh","-c","go run ./cmd/producer"]

  ingestor-coinbase-dev:
    <<: *go-dev-service
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      RAW_TICKS_TOPIC: ${RAW_TICKS_COINBASE_TOPIC:-raw.ticks.coinbase}
      COINBASE_PRODUCT_ID: ${COINBASE_PRODUCT_ID:-BTC-USD}
    command: ["sh","-c","go run ./cmd/ingestor-coinbase"]

  ingestor-kraken-dev:
    <<: *go-dev-service
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      RAW_TICKS_TOPIC: ${RAW_TICKS_KRAKEN_TOPIC:-raw.ticks.kraken}
      KRAKEN_SYMBOL: ${KRAKEN_SYMBOL:-BTC/USD}
    command: ["sh","-c","go run ./cmd/ingestor-kraken"]

  normalizer-dev:
    <<: *go-dev-service
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      RAW_TICKS_TOPIC: ${RAW_TICKS_COINBASE_TOPIC:-raw.ticks.coinbase}
      NORMALIZED_TICKS_TOPIC: ${NORMALIZED_TICKS_TOPIC:-normalized.ticks}
      KAFKA_GROUP_ID: ${NORMALIZER_COINBASE_GROUP_ID:-arbiter-normalizer}
      KAFKA_START_OFFSET: ${NORMALIZER_START_OFFSET:-latest}
    command: ["sh","-c","go run ./cmd/normalizer"]

  normalizer-kraken-dev:
    <<: *go-dev-service
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      RAW_TICKS_TOPIC: ${RAW_TICKS_KRAKEN_TOPIC:-raw.ticks.kraken}
      NORMALIZED_TICKS_TOPIC: ${NORMALIZED_TICKS_TOPIC:-normalized.ticks}
      KAFKA_GROUP_ID: ${NORMALIZER_KRAKEN_GROUP_ID:-arbiter-normalizer-kraken}
      KAFKA_START_OFFSET: ${NORMALIZER_START_OFFSET:-latest}
    command: ["sh","-c","go run ./cmd/normalizer"]

  detector-dev:
    <<: *go-dev-service
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      NORMALIZED_TICKS_TOPIC: ${NORMALIZED_TICKS_TOPIC:-normalized.ticks}
      SIGNALS_TOPIC: ${SIGNALS_TOPIC:-arbitrage.signals}
      KAFKA_GROUP_ID: ${DETECTOR_GROUP_ID:-arbiter-detector}
      KAFKA_START_OFFSET: ${DETECTOR_START_OFFSET:-latest}
    command: ["sh","-c","go run ./cmd/detector"]
